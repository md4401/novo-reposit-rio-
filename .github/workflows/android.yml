# Gera o APK Android a cada mudança no app e publica em Releases do GitHub.
name: APK Android

on:
  push:
    branches: [main]
    paths: ["android/**", "capacitor.config.ts", "package.json", "package-lock.json", "public/**", "src/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Gerar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ninho.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ninho-apk
          path: ninho.apk
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ninho. Android (build ${{ github.run_number }})
          make_latest: true
          files: ninho.apk
          body: |
            APK de teste do ninho. Para instalar: baixe o ninho.apk no celular Android,
            abra o arquivo e permita "instalar apps desta fonte".
            O app abre https://ninho-financas-familia.vercel.app — atualizações do site chegam sozinhas.
