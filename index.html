<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d2922" />
    <meta name="description" content="ninho. — finanças inteligentes da família: cada um com seus detalhes privados, a casa com os totais compartilhados." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ninho." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>ninho. — Finanças da família</title>
    <script>
      // Tema antes de desenhar a página (a lógica completa fica em src/lib/theme.ts)
      try {
        var t = localStorage.getItem("ninho.theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      /* Primeiro quadro da abertura (igual ao splash do Android): nada de tela branca enquanto o app carrega */
      #boot { position: fixed; inset: 0; z-index: 9998; display: grid; place-items: center; background: radial-gradient(120% 80% at 50% 45%, #14382e 0%, #0d2922 55%, #081d18 100%); }
      #boot i { width: 14px; height: 14px; border-radius: 50%; background: #c7f46c; box-shadow: 0 0 22px 4px rgba(199, 244, 108, 0.45); }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><i></i></div>
    <div id="root"></div>
    <noscript>Ative o JavaScript para usar o ninho.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
