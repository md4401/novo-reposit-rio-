# App Android.
# - push / pull request: só confere se o projeto compila (APK de depuração, sem segredos, sem release).
# - "Run workflow" manual: gera o APK de PRODUÇÃO assinado com a chave guardada nos secrets
#   e cria um RASCUNHO de release (quem publica é o dono, depois de conferir).
# Configuração da chave: docs/assinatura-android.md
name: APK Android

on:
  push:
    branches: [main]
    paths: ["android/**", "android-web/**", "capacitor.config.ts", "package.json", "package-lock.json", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "android-web/**", "capacitor.config.ts", "package.json", "package-lock.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npx cap sync android
      - name: Compilar (depuração, chave temporária do runner)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Crie o ambiente "android-release" em Settings → Environments para exigir aprovação.
    environment: android-release
    permissions:
      contents: write
    steps:
      - name: Conferir secrets da assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Assinatura de produção não configurada. Faltam:$missing (veja docs/assinatura-android.md)"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Restaurar keystore (arquivo temporário)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ninho-release.keystore"
      - name: Gerar APK de produção
        working-directory: android
        env:
          NINHO_KEYSTORE_FILE: ${{ runner.temp }}/ninho-release.keystore
          NINHO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NINHO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NINHO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Conferir a assinatura do APK
        env:
          CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          expected=$(echo "$CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          compromised=3659599b4b88e183ecc5d032dcb5694b8fc06eb4f9b877703998e793dc1b8aef
          if [ "$actual" = "$compromised" ]; then echo "::error::APK assinado com a chave comprometida"; exit 1; fi
          if [ "$actual" != "$expected" ]; then echo "::error::Certificado do APK ($actual) diferente de ANDROID_CERT_SHA256"; exit 1; fi
          cp "$apk" ninho.apk
      - name: Apagar o keystore temporário
        if: always()
        run: rm -f "$RUNNER_TEMP/ninho-release.keystore"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ninho-apk
          path: ninho.apk
      - name: Criar rascunho de release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: android-${{ github.run_number }}
          name: ninho. Android (build ${{ github.run_number }})
          draft: true
          files: ninho.apk
          body: |
            APK de produção do ninho. Confira antes de publicar.
            Quem tem uma versão até a 0.3.0 (chave antiga) precisa desinstalar o app e instalar este;
            os dados ficam na conta e voltam ao entrar.
